<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Size</title>
    <style>
      tr{
        height: 100px;

      }
      table{
       border: 1px solid aqua;
      }
    </style>
</head>
<body>
  <table style="width:100%" border="1">
    <tr>
      <th>Country</th>
      <th>Continent</th>
      <th>Population</th>
    </tr>
    <tr>
      <td>Qatar</td>
      <td>Middle East</td>
      <td>3,063,005</td>
    </tr>
    <tr>
      <td>Australia</td>
      <td>Oceania</td>
      <td>27,470,300</td>
    </tr>
  </table>
</body>
</html>
